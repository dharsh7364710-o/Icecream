<!DOCTYPE html>
<html>
<head>
<title>DevaMMart Login</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#b3e5fc,#e1f5fe);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center
}
.container{
width:400px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.2)
}
h1{text-align:center;color:#1976d2}
h2{text-align:center;color:#555}
label{display:block;margin-top:15px;font-weight:bold}
input,select{
width:100%;
padding:12px;
margin-top:7px;
border:1px solid #bbb;
border-radius:8px;
font-size:15px
}
button{
width:100%;
padding:13px;
margin-top:22px;
border:0;
border-radius:8px;
background:#1976d2;
color:white;
font-size:16px;
cursor:pointer
}
.register{text-align:center;margin-top:18px}
.register a{
color:#1976d2;
font-weight:bold;
text-decoration:none
}
</style>
</head>

<body>

<div class="container">

<h1>🍦 DevaMMart</h1>
<h2>Login</h2>

<form id="loginForm">

<label>Login As</label>

<select id="role" required>
<option value="">Select Role</option>
<option value="BUYER">Buyer</option>
<option value="SELLER">Seller</option>
<option value="ADMIN">Admin</option>
</select>

<label>Email</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit">Login</button>

</form>

<div class="register">
New user?
<a href="register.html">Register</a>
</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",async function(e){

e.preventDefault();

let role=document.getElementById("role").value;
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;

let data=
"role="+encodeURIComponent(role)+
"&email="+encodeURIComponent(email)+
"&password="+encodeURIComponent(password);

try{

let response=await fetch("http://localhost:8080/login",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:data
});

let result=await response.text();

if(response.ok && result.startsWith("Login Successful")){

let parts=result.split("|");

localStorage.setItem("userName",parts[1]);
localStorage.setItem("userRole",parts[2]);
localStorage.setItem("userEmail",email);

if(parts[2]==="BUYER"){

window.location.href="./products.html";

}

else if(parts[2]==="SELLER"){

window.location.href="./seller.html";

}

else if(parts[2]==="ADMIN"){

window.location.href="./admin.html";

}

}

else{

alert(result);

}

}

catch(error){

alert("Backend server is not running!");

console.log(error);

}

});

</script>

</body>
</html>

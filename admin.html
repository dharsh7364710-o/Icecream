<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Deva EMart - Admin</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef7ff;
color:#222;
}

header{
background:#1769aa;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

header h1{
margin:0;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

.container{
padding:25px;
max-width:1200px;
margin:auto;
}

.welcome{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:25px;
box-shadow:0 3px 10px #bbb;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 10px #bbb;
}

.card h2{
margin:5px;
color:#1769aa;
}

.section{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:25px;
box-shadow:0 3px 10px #bbb;
}

.section h2{
color:#1769aa;
}

.user,.order{
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.user{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
}

.user-info{
flex:1;
}

.delete{
background:#e53935;
color:white;
border:0;
padding:9px 15px;
border-radius:8px;
cursor:pointer;
}

.order{
background:#fafafa;
}

.order-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.status{
background:#e8f5e9;
color:#2e7d32;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

.order-details{
display:flex;
gap:20px;
align-items:center;
margin-top:15px;
}

.order-details img{
width:100px;
height:100px;
object-fit:cover;
border-radius:12px;
}

.details h3{
margin-top:0;
}

.total{
font-weight:bold;
color:#1769aa;
}

.no-data{
text-align:center;
padding:25px;
color:#777;
}

@media(max-width:800px){
.stats{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:500px){
.stats{
grid-template-columns:1fr;
}

header{
gap:15px;
}

nav a{
margin-left:8px;
}
}
</style>
</head>

<body>

<header>

<h1>🍦 Deva EMart - Admin</h1>

<nav>
<a href="./admin.html">🏠 Admin</a>
<a href="./products.html">🍦 Products</a>
<a href="./orders.html">📦 Orders</a>
</nav>

</header>

<div class="container">

<div class="welcome">
<h2>👑 Welcome Admin</h2>
<p>Manage users, products and customer orders.</p>
</div>

<div class="stats">

<div class="card">
<div>👤</div>
<h2 id="totalUsers">0</h2>
<p>Total Users</p>
</div>

<div class="card">
<div>🍦</div>
<h2 id="totalProducts">15</h2>
<p>Total Products</p>
</div>

<div class="card">
<div>📦</div>
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>

<div class="card">
<div>💰</div>
<h2 id="totalSales">₹0</h2>
<p>Total Sales</p>
</div>

</div>

<div class="section">

<h2>👤 Registered Users</h2>

<div id="usersContainer"></div>

</div>

<div class="section">

<h2>📦 Customer Orders</h2>

<div id="ordersContainer"></div>

</div>

</div>

<script>

let products=[
"Mango Ice Cream",
"Strawberry Ice Cream",
"Chocolate Ice Cream",
"Vanilla Ice Cream",
"Pistachio Ice Cream",
"Blackcurrant Ice Cream",
"Cookies & Cream",
"Butterscotch Ice Cream",
"Kulfi",
"Blueberry Ice Cream",
"Pista Almond Ice Cream",
"Tender Coconut Ice Cream",
"Coffee Ice Cream",
"Caramel Ice Cream",
"Red Velvet Ice Cream"
];

function loadUsers(){

let users=[];

let buyer=
JSON.parse(localStorage.getItem("buyerAccount"));

let seller=
JSON.parse(localStorage.getItem("sellerAccount"));

let admin=
JSON.parse(localStorage.getItem("adminAccount"));

if(buyer){
users.push({
role:"Buyer",
data:buyer
});
}

if(seller){
users.push({
role:"Seller",
data:seller
});
}

if(admin){
users.push({
role:"Admin",
data:admin
});
}

let container=
document.getElementById("usersContainer");

container.innerHTML="";

document.getElementById("totalUsers").innerText=
users.length;

if(users.length===0){

container.innerHTML=
'<div class="no-data">No registered users yet.</div>';

return;
}

users.forEach(function(user,index){

let data=user.data;

let name=data.name||data.sellerName||data.adminName||"User";

let email=data.email||"-";

let phone=data.phone||"-";

let shop=data.shopName||"";

container.innerHTML+=`

<div class="user">

<div class="user-info">

<h3>${user.role}: ${name}</h3>

<p>📧 Email: ${email}</p>

<p>📱 Phone: ${phone}</p>

${shop?`<p>🏪 Shop: ${shop}</p>`:""}

</div>

<button class="delete"
onclick="deleteUser('${user.role}')">
Delete
</button>

</div>

`;

});

}

function deleteUser(role){

let key="";

if(role==="Buyer"){
key="buyerAccount";
}

else if(role==="Seller"){
key="sellerAccount";
}

else if(role==="Admin"){
key="adminAccount";
}

if(confirm("Delete this "+role+" account?")){

localStorage.removeItem(key);

loadUsers();

}

}

function loadOrders(){

let orders=
JSON.parse(
localStorage.getItem("devaEMartOrders")
)||[];

let container=
document.getElementById("ordersContainer");

container.innerHTML="";

document.getElementById("totalOrders").innerText=
orders.length;

let sales=0;

orders.forEach(function(order){

let quantity=order.quantity||1;

let price=Number(order.price)||0;

let total=
Number(order.total)||price*quantity;

sales+=total;

});

document.getElementById("totalSales").innerText=
"₹"+sales;

if(orders.length===0){

container.innerHTML=
'<div class="no-data">📦 No customer orders yet.</div>';

return;

}

orders.forEach(function(order,index){

let quantity=order.quantity||1;

let price=Number(order.price)||0;

let total=
Number(order.total)||price*quantity;

let status=
order.status||"Order Placed";

container.innerHTML+=`

<div class="order">

<div class="order-top">

<h3>Order #${index+1}</h3>

<div class="status">${status}</div>

</div>

<div class="order-details">

<img src="${order.image}" alt="${order.name}">

<div class="details">

<h3>${order.name}</h3>

<p>Price: ₹${price}</p>

<p>Quantity: ${quantity}</p>

<p class="total">
Total: ₹${total}
</p>

<p>
Status: ${status}
</p>

</div>

</div>

</div>

`;

});

}

loadUsers();
loadOrders();

</script>

</body>
</html>

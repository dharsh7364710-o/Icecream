<!DOCTYPE html>
<html>
<head>
<title>Deva M Mart - Login</title>
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0d47a1,#42a5f5,#e3f2fd);
padding:20px
}

.card{
width:430px;
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.25)
}

.logo{
text-align:center;
margin-bottom:25px
}

.icon{
width:65px;
height:65px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#0d47a1,#42a5f5);
display:flex;
justify-content:center;
align-items:center;
font-size:30px
}

h1{
margin-top:10px;
color:#0d47a1
}

.sub{
color:#777;
margin-top:5px
}

h2{
color:#17324d;
margin:20px 0
}

.roles{
display:flex;
gap:8px;
margin-bottom:20px
}

.roles button{
flex:1;
padding:12px 5px;
border:1px solid #1976d2;
border-radius:10px;
background:#e3f2fd;
color:#0d47a1;
font-weight:bold;
cursor:pointer
}

.roles button.active{
background:#1976d2;
color:white
}

label{
display:block;
margin:12px 0 6px;
font-weight:bold;
color:#263238
}

input{
width:100%;
padding:13px;
border:1px solid #c7d7e8;
border-radius:11px;
background:#f8fbff;
outline:none
}

input:focus{
border-color:#1976d2;
box-shadow:0 0 0 3px rgba(25,118,210,.12)
}

.btn{
width:100%;
padding:14px;
margin-top:22px;
border:0;
border-radius:12px;
background:linear-gradient(90deg,#0d47a1,#1976d2,#42a5f5);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer
}

#message{
text-align:center;
margin-top:15px;
font-weight:bold
}

.bottom{
text-align:center;
margin-top:18px;
color:#666
}

.bottom a{
color:#1565c0;
font-weight:bold;
text-decoration:none
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
<div class="icon">🍦</div>
<h1>Deva M Mart</h1>
<p class="sub">Login to your account</p>
</div>

<h2>Login</h2>

<div class="roles">
<button id="buyerBtn" onclick="selectRole('buyer')">👤 Buyer</button>
<button id="sellerBtn" onclick="selectRole('seller')">🏪 Seller</button>
<button id="adminBtn" onclick="selectRole('admin')">🛠️ Admin</button>
</div>

<label>Email</label>
<input type="email" id="email" placeholder="Enter email">

<label>Password</label>
<input type="password" id="password" placeholder="Enter password">

<button class="btn" onclick="login()">Login</button>

<p id="message"></p>

<p class="bottom">
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

<script>

let selectedRole=localStorage.getItem("lastRegisteredRole")||"buyer";

function selectRole(role){

selectedRole=role;

document.getElementById("buyerBtn").classList.remove("active");
document.getElementById("sellerBtn").classList.remove("active");
document.getElementById("adminBtn").classList.remove("active");

if(role==="buyer"){
document.getElementById("buyerBtn").classList.add("active");
}

if(role==="seller"){
document.getElementById("sellerBtn").classList.add("active");
}

if(role==="admin"){
document.getElementById("adminBtn").classList.add("active");
}

loadAccount();
}

function loadAccount(){

let account=JSON.parse(localStorage.getItem(selectedRole+"Account"));

let email=document.getElementById("email");
let password=document.getElementById("password");
let message=document.getElementById("message");

message.innerHTML="";

if(account){
email.value=account.email;
password.value=account.password;
}else{
email.value="";
password.value="";
}

}

function login(){

let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;
let message=document.getElementById("message");

let account=JSON.parse(localStorage.getItem(selectedRole+"Account"));

if(!account){

message.style.color="red";
message.innerHTML="No registered account found!";
return;

}

if(email===account.email&&password===account.password){

message.style.color="green";
message.innerHTML="Login Successful! ✓";

setTimeout(function(){

if(selectedRole==="buyer"){
window.location.href="buyer.html";
}

if(selectedRole==="seller"){
window.location.href="seller.html";
}

if(selectedRole==="admin"){
window.location.href="admin.html";
}

},1000);

}else{

message.style.color="red";
message.innerHTML="Invalid Email or Password!";

}

}

selectRole(selectedRole);

</script>

</body>
</html>

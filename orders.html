<!DOCTYPE html>
<html>
<head>
<title>Deva EMart - My Orders</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eaf6ff;
color:#123;
}

header{
background:#1976d2;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

header h1{
margin:0;
}

nav{
display:flex;
gap:20px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1100px;
margin:30px auto;
padding:20px;
}

.container>h1{
color:#1976d2;
}

.order{
background:white;
border-radius:18px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.order-title{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
padding-bottom:12px;
}

.order-title h2{
margin:0;
color:#1976d2;
}

.status{
background:#dff5e3;
color:#218838;
padding:8px 15px;
border-radius:20px;
font-weight:bold;
}

.item{
display:flex;
align-items:center;
gap:25px;
padding:20px 0;
}

.item img{
width:150px;
height:120px;
object-fit:cover;
border-radius:14px;
}

.details{
flex:1;
}

.details h3{
margin:0 0 10px;
font-size:22px;
}

.price{
font-size:18px;
font-weight:bold;
color:#1976d2;
margin:8px 0;
}

.quantity{
font-size:16px;
margin:8px 0;
}

.total{
border-top:1px solid #ddd;
padding-top:15px;
text-align:right;
font-size:21px;
font-weight:bold;
color:#1976d2;
}

.empty{
background:white;
border-radius:18px;
padding:60px 20px;
text-align:center;
font-size:22px;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.shop{
margin-top:20px;
background:#1976d2;
color:white;
border:0;
padding:13px 25px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

@media(max-width:700px){

header{
flex-direction:column;
gap:15px;
}

.item{
flex-direction:column;
text-align:center;
}

.details{
width:100%;
}

.order-title{
flex-direction:column;
gap:10px;
}

.total{
text-align:center;
}

}
</style>

</head>

<body>

<header>

<h1>🍦 Deva EMart</h1>

<nav>

<a href="./products.html">🏠 Home</a>

<a href="./cart.html">🛒 Cart</a>

<a href="./orders.html">📦 Orders</a>

</nav>

</header>

<div class="container">

<h1>📦 My Orders</h1>

<div id="ordersContainer"></div>

</div>

<script>

function displayOrders(){

let orders=
JSON.parse(
localStorage.getItem("devaEMartOrders")
)||[];

let container=
document.getElementById("ordersContainer");

container.innerHTML="";

if(orders.length===0){

container.innerHTML=`

<div class="empty">

📦 No Orders Yet!

<br>

<button class="shop" onclick="goHome()">
Start Shopping 🍦
</button>

</div>

`;

return;

}

orders.forEach(function(order,index){

let quantity=order.quantity||1;

let price=Number(order.price)||0;

let total=
order.total||
(price*quantity);

container.innerHTML+=`

<div class="order">

<div class="order-title">

<h2>
Order #${index+1}
</h2>

<div class="status">
${order.status||"Order Placed"}
</div>

</div>

<div class="item">

<img
src="${order.image}"
alt="${order.name}"
>

<div class="details">

<h3>
${order.name}
</h3>

<div class="price">
Price: ₹${price}
</div>

<div class="quantity">
Quantity: ${quantity}
</div>

</div>

</div>

<div class="total">

Total: ₹${total}

</div>

</div>

`;

});

}

function goHome(){

window.location.href="./products.html";

}

displayOrders();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Deva EMart - Buy Now</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eaf6ff;
color:#123;
}

header{
background:#1976d2;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

.container{
max-width:700px;
margin:40px auto;
padding:20px;
}

.box{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 4px 12px #bbb;
text-align:center;
}

.box img{
width:300px;
height:240px;
object-fit:cover;
border-radius:15px;
}

.box h2{
color:#1976d2;
font-size:28px;
}

.price{
font-size:22px;
font-weight:bold;
color:#1976d2;
margin:15px;
}

.quantity{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin:20px;
}

.quantity button{
width:40px;
height:40px;
border:0;
border-radius:8px;
background:#5270b5;
color:white;
font-size:22px;
cursor:pointer;
}

.quantity span{
font-size:20px;
font-weight:bold;
}

.total{
font-size:24px;
font-weight:bold;
margin:20px;
}

.pay{
background:#1976d2;
color:white;
border:0;
padding:14px 35px;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.back{
display:inline-block;
margin-top:15px;
color:#1976d2;
text-decoration:none;
font-weight:bold;
}

.empty{
text-align:center;
font-size:22px;
padding:50px;
}

</style>
</head>

<body>

<header>

<h1>🍦 Deva EMart</h1>

<nav>
<a href="./products.html">🏠 Home</a>
<a href="./cart.html">🛒 Cart</a>
<a href="./orders.html">📦 Orders</a>
</nav>

</header>

<div class="container">

<div class="box" id="productBox"></div>

</div>

<script>

let product=
JSON.parse(localStorage.getItem("devaEMartBuyNow"));

let box=document.getElementById("productBox");

let quantity=1;

if(!product){

box.innerHTML=`

<div class="empty">

No product selected! 🍦

<br><br>

<a class="back" href="./products.html">
Go to Home
</a>

</div>

`;

}else{

box.innerHTML=`

<img
src="${product.image}"
alt="${product.name}"
>

<h2>${product.name}</h2>

<div class="price">
Price: ₹${product.price}
</div>

<div class="quantity">

<button onclick="decrease()">
−
</button>

<span id="quantity">1</span>

<button onclick="increase()">
+
</button>

</div>

<div class="total">

Total: ₹<span id="total">
${product.price}
</span>

</div>

<button class="pay" onclick="payNow()">
💳 Pay Now
</button>

<br>

<a class="back" href="./products.html">
← Continue Shopping
</a>

`;

}

function increase(){

quantity++;

document.getElementById("quantity").innerText=quantity;

document.getElementById("total").innerText=
product.price*quantity;

}

function decrease(){

if(quantity>1){

quantity--;

document.getElementById("quantity").innerText=quantity;

document.getElementById("total").innerText=
product.price*quantity;

}

}

function payNow(){

let orders=
JSON.parse(
localStorage.getItem("devaEMartOrders")
)||[];

let order={

name:product.name,

price:product.price,

image:product.image,

quantity:quantity,

total:product.price*quantity,

status:"Order Placed"

};

orders.push(order);

localStorage.setItem(
"devaEMartOrders",
JSON.stringify(orders)
);

localStorage.removeItem("devaEMartBuyNow");

alert(
"Order placed successfully! 🍦🎉\n"+
product.name+
"\nTotal: ₹"+
(product.price*quantity)
);

window.location.href="./orders.html";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - DevaMMart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1565c0, #64b5f6);
        }
        .welcome-box {
            width: 90%;
            max-width: 550px;
            text-align: center;
            background: white;
            padding: 55px 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        .icecream {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #1565c0;
            font-size: 40px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }
        button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 14px 38px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <div class="icecream">🍦</div>
        <h1>Welcome to DevaMMart</h1>
        <p>Your Happy Place for Delicious Ice Creams! 🍨</p>
        <button onclick="location.href='login.html'">
            Get Started
        </button>
    </div>
</body>
</html>

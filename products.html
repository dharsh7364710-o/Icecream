<!DOCTYPE html>
<html>
<head>
<title>DevaMMart - Ice Cream Shop</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eaf6ff;
color:#123;
}

header{
background:#1976d2;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

header h1{
margin:0;
font-size:26px;
}

nav{
display:flex;
gap:20px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

.hero{
text-align:center;
padding:30px 20px;
}

.hero h2{
color:#1976d2;
font-size:30px;
margin:10px;
}

.hero p{
font-size:17px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.card{
background:white;
border-radius:18px;
padding:15px;
box-shadow:0 4px 12px #bbb;
text-align:center;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
display:block;
background:#eaf6ff;
}

.card h3{
font-size:20px;
margin:15px 0 8px;
}

.price{
font-size:20px;
font-weight:bold;
color:#1976d2;
margin-bottom:15px;
}

button{
border:0;
padding:11px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin:4px;
}

.cart-btn{
background:#43a047;
color:white;
}

.buy-btn{
background:#1976d2;
color:white;
}

button:hover{
opacity:.85;
}

@media(max-width:900px){
.products{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:600px){
.products{
grid-template-columns:1fr;
}

header{
gap:15px;
}
}
</style>

</head>

<body>

<header>

<h1>🍦 Welcome to DevaMMart</h1>

<nav>
<a href="products.html">🏠 Home</a>
<a href="cart.html">🛒 Cart</a>
<a href="orders.html">📦 Orders</a>
</nav>

</header>

<div class="hero">

<h2>Our Ice Creams 🍨</h2>

<p>
Discover delicious and refreshing ice creams.
Choose your favourite flavour and enjoy!
</p>

</div>

<div class="container">

<div class="products" id="products"></div>

</div>

<script>

const products=[

{

{

},

{
id:9,
name:"Kulfi",
price:110,

},

{

},

{

{

},

{
id:13,
name:"Coffee Ice Cream",
price:130,
image:"https://images.unsplash.com/photo-1579954115545-a95591f28bfc?auto=format&fit=crop&w=800&q=80"
},

{
id:14,
name:"Caramel Ice Cream",
price:140,
image:"https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?auto=format&fit=crop&w=800&q=80"
},

{
id:15,
name:"Red Velvet Ice Cream",
price:150,
image:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=800&q=80"
}

];

let cart=
JSON.parse(localStorage.getItem("devaEMartCart"))||[];

function displayProducts(){

const container=
document.getElementById("products");

container.innerHTML="";

products.forEach((product,index)=>{

container.innerHTML+=`

<div class="card">

<img
src="${product.image}"
alt="${product.name}"
onerror="this.src='https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?auto=format&fit=crop&w=800&q=80'"
>

<h3>${product.name}</h3>

<div class="price">
₹${product.price}
</div>

<button
class="cart-btn"
onclick="addToCart(${index})">
🛒 Add to Cart
</button>

<button
class="buy-btn"
onclick="buyNow(${index})">
⚡ Buy Now
</button>

</div>

`;

});

}

function addToCart(index){

const product=products[index];

const existing=
cart.find(item=>item.name===product.name);

if(existing){

existing.quantity++;

}else{

cart.push({
id:product.id,
name:product.name,
price:product.price,
image:product.image,
quantity:1
});

}

localStorage.setItem(
"devaEMartCart",
JSON.stringify(cart)
);

alert(
product.name+
" added to cart successfully! 🍦🛒"
);

}

function buyNow(index){

const product=products[index];

const buyProduct={
id:product.id,
name:product.name,
price:product.price,
image:product.image,
quantity:1
};

localStorage.setItem(
"devaEMartBuyNow",
JSON.stringify(buyProduct)
);

window.location.href="buy-now.html";

}

displayProducts();

</script>

</body>
</html>

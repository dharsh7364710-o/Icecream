<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Deva M Mart - Register</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#dbeafe,#93c5fd,#60a5fa);
padding:25px 15px;
}
.container{
width:100%;
max-width:450px;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 8px 30px rgba(0,0,0,0.15);
}
.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#1565c0;
margin-bottom:8px;
}
.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}
h2{
text-align:center;
margin-bottom:20px;
color:#222;
}
label{
display:block;
font-weight:bold;
margin:13px 0 6px;
color:#333;
}
input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
background:white;
}
input:focus,select:focus{
border-color:#1976d2;
outline:none;
}
button{
width:100%;
padding:13px;
margin-top:22px;
background:#1976d2;
color:white;
border:none;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}
button:hover{
background:#0d47a1;
}
.role-fields{
display:none;
}
.message{
display:none;
margin-top:15px;
padding:12px;
border-radius:8px;
text-align:center;
font-weight:bold;
}
.success{
display:block;
background:#dcfce7;
color:#166534;
}
.error{
display:block;
background:#fee2e2;
color:#b91c1c;
}
.login{
text-align:center;
margin-top:18px;
color:#555;
}
.login a{
color:#1565c0;
font-weight:bold;
text-decoration:none;
}
</style>
</head>
<body>
<div class="container">

<div class="logo">🍦 Deva M Mart</div>
<p class="subtitle">Your Favourite Ice Cream Store</p>
<h2>Create Account</h2>

<form id="registerForm" autocomplete="off">

<label for="role">Select Your Role</label>
<select id="role" name="role" required>
<option value="" selected disabled>-- Select Role --</option>
<option value="buyer">Buyer</option>
<option value="seller">Seller</option>
<option value="admin">Admin</option>
</select>

<div id="buyerFields" class="role-fields">
<label for="buyerName">Buyer Name</label>
<input type="text" id="buyerName" name="buyerName" placeholder="Enter your name" autocomplete="off">

<label for="buyerEmail">Email</label>
<input type="email" id="buyerEmail" name="buyerEmail" placeholder="Enter your email" autocomplete="off" autocapitalize="none">

<label for="buyerPassword">Password</label>
<input type="password" id="buyerPassword" name="buyerPassword" placeholder="Create your password" autocomplete="new-password">

<label for="buyerContact">Contact Number</label>
<input type="tel" id="buyerContact" name="buyerContact" placeholder="Enter your contact number" maxlength="10" pattern="[0-9]{10}" autocomplete="off">
</div>

<div id="sellerFields" class="role-fields">
<label for="sellerName">Seller Name</label>
<input type="text" id="sellerName" name="sellerName" placeholder="Enter seller name" autocomplete="off">

<label for="sellerEmail">Email</label>
<input type="email" id="sellerEmail" name="sellerEmail" placeholder="Enter your email" autocomplete="off" autocapitalize="none">

<label for="sellerPassword">Password</label>
<input type="password" id="sellerPassword" name="sellerPassword" placeholder="Create your password" autocomplete="new-password">
</div>

<div id="adminFields" class="role-fields">
<label for="adminName">Admin Name</label>
<input type="text" id="adminName" name="adminName" placeholder="Enter admin name" autocomplete="off">

<label for="adminEmail">Email</label>
<input type="email" id="adminEmail" name="adminEmail" placeholder="Enter your email" autocomplete="off" autocapitalize="none">

<label for="adminPassword">Password</label>
<input type="password" id="adminPassword" name="adminPassword" placeholder="Create your password" autocomplete="new-password">

<label for="shopName">Shop Name</label>
<input type="text" id="shopName" name="shopName" placeholder="Enter your shop name" autocomplete="off">
</div>

<button type="submit">Register</button>

<div id="message" class="message"></div>

</form>

<p class="login">Already have an account? <a href="login.html">Login</a></p>

</div>

<script>
const roleSelect=document.getElementById("role");
const form=document.getElementById("registerForm");
const message=document.getElementById("message");

const sections={
buyer:document.getElementById("buyerFields"),
seller:document.getElementById("sellerFields"),
admin:document.getElementById("adminFields")
};

function clearFields(){
Object.values(sections).forEach(section=>{
section.querySelectorAll("input").forEach(input=>{
input.value="";
input.required=false;
});
});
}

function updateFields(){
clearFields();

Object.values(sections).forEach(section=>{
section.style.display="none";
});

message.className="message";
message.textContent="";

const selected=roleSelect.value;

if(sections[selected]){
sections[selected].style.display="block";

sections[selected].querySelectorAll("input").forEach(input=>{
input.required=true;
});
}
}

roleSelect.addEventListener("change",updateFields);

form.addEventListener("submit",function(event){
event.preventDefault();

if(!form.checkValidity()){
form.reportValidity();
return;
}

const role=roleSelect.value;
const user={role:role};

const activeSection=sections[role];

activeSection.querySelectorAll("input").forEach(input=>{
user[input.name]=input.value.trim();
});

const emailField=role==="buyer"?"buyerEmail":role==="seller"?"sellerEmail":"adminEmail";

let users=[];

try{
users=JSON.parse(localStorage.getItem("devaMMartUsers"))||[];
}catch(error){
users=[];
}

const email=user[emailField].toLowerCase();

if(users.some(existing=>
existing.role===role&&
existing[emailField]&&
existing[emailField].toLowerCase()===email
)){
message.className="message error";
message.textContent="This email is already registered for this role!";
return;
}

users.push(user);

localStorage.setItem("devaMMartUsers",JSON.stringify(users));

message.className="message success";
message.textContent="Registration Successful!";

form.reset();
clearFields();

Object.values(sections).forEach(section=>{
section.style.display="none";
});

});
</script>
</div>
</body>
</html>

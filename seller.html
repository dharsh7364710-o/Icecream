<!DOCTYPE html>
<html>
<head>
<title>Deva EMart - Seller</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eaf6ff;
color:#123;
}

header{
background:#1976d2;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

header h1{
margin:0;
}

nav{
display:flex;
gap:20px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1100px;
margin:30px auto;
padding:20px;
}

.welcome{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 4px 12px #bbb;
margin-bottom:25px;
}

.welcome h2{
color:#1976d2;
margin-top:0;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:30px;
}

.stat{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 4px 12px #bbb;
}

.stat h2{
color:#1976d2;
margin:5px;
font-size:30px;
}

.orders{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 4px 12px #bbb;
}

.orders h2{
color:#1976d2;
}

.order{
border:1px solid #ddd;
border-radius:15px;
padding:18px;
margin-bottom:18px;
}

.order-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.order-top h3{
margin:0;
color:#1976d2;
}

.item{
display:flex;
align-items:center;
gap:20px;
}

.item img{
width:120px;
height:100px;
object-fit:cover;
border-radius:12px;
}

.details{
flex:1;
}

.details h3{
margin:0 0 8px;
}

.price{
font-weight:bold;
color:#1976d2;
}

.status{
padding:8px 14px;
border-radius:20px;
background:#fff3cd;
color:#856404;
font-weight:bold;
}

select{
padding:10px;
border-radius:8px;
border:1px solid #aaa;
margin-top:12px;
}

.total{
font-size:18px;
font-weight:bold;
color:#1976d2;
margin-top:12px;
}

.no-orders{
text-align:center;
padding:40px;
font-size:20px;
}

@media(max-width:700px){

header{
flex-direction:column;
gap:15px;
}

.stats{
grid-template-columns:1fr;
}

.item{
flex-direction:column;
text-align:center;
}

.order-top{
flex-direction:column;
gap:10px;
}

}
</style>

</head>

<body>

<header>

<h1>🍦 Deva EMart - Seller</h1>

<nav>
<a href="./seller.html">🏠 Home</a>
<a href="./products.html">🍦 Products</a>
</nav>

</header>

<div class="container">

<div class="welcome">

<h2>Welcome Seller 👋</h2>

<p>
Manage your ice cream orders and check customer purchases here.
</p>

</div>

<div class="stats">

<div class="stat">
<p>📦 Total Orders</p>
<h2 id="totalOrders">0</h2>
</div>

<div class="stat">
<p>⏳ Pending Orders</p>
<h2 id="pendingOrders">0</h2>
</div>

<div class="stat">
<p>💰 Total Sales</p>
<h2>₹<span id="totalSales">0</span></h2>
</div>

</div>

<div class="orders">

<h2>📦 Customer Orders</h2>

<div id="ordersContainer"></div>

</div>

</div>

<script>

function loadOrders(){

let orders=
JSON.parse(
localStorage.getItem("devaEMartOrders")
)||[];

let container=
document.getElementById("ordersContainer");

container.innerHTML="";

document.getElementById("totalOrders").innerText=
orders.length;

let pending=0;
let sales=0;

orders.forEach(function(order){

let quantity=order.quantity||1;

let price=Number(order.price)||0;

let total=
order.total||
price*quantity;

sales+=total;

if(
order.status!=="Delivered"
){
pending++;
}

});

document.getElementById("pendingOrders").innerText=
pending;

document.getElementById("totalSales").innerText=
sales;

if(orders.length===0){

container.innerHTML=`

<div class="no-orders">

📦 No customer orders yet.

</div>

`;

return;

}

orders.forEach(function(order,index){

let quantity=order.quantity||1;

let price=Number(order.price)||0;

let total=
order.total||
price*quantity;

let status=
order.status||
"Order Placed";

container.innerHTML+=`

<div class="order">

<div class="order-top">

<h3>
Order #${index+1}
</h3>

<div class="status">
${status}
</div>

</div>

<div class="item">

<img
src="${order.image}"
alt="${order.name}"
>

<div class="details">

<h3>
${order.name}
</h3>

<div class="price">
Price: ₹${price}
</div>

<p>
Quantity: ${quantity}
</p>

<div class="total">
Total: ₹${total}
</div>

<select
onchange="updateStatus(${index},this.value)"
>

<option value="Order Placed"
${status==="Order Placed"?"selected":""}>
Order Placed
</option>

<option value="Preparing"
${status==="Preparing"?"selected":""}>
Preparing
</option>

<option value="Out for Delivery"
${status==="Out for Delivery"?"selected":""}>
Out for Delivery
</option>

<option value="Delivered"
${status==="Delivered"?"selected":""}>
Delivered
</option>

</select>

</div>

</div>

</div>

`;

});

}

function updateStatus(index,status){

let orders=
JSON.parse(
localStorage.getItem("devaEMartOrders")
)||[];

if(orders[index]){

orders[index].status=status;

localStorage.setItem(
"devaEMartOrders",
JSON.stringify(orders)
);

}

loadOrders();

}

loadOrders();

</script>

</body>
</html>

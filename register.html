<!DOCTYPE html>
<html>
<head>
<title>Deva M Mart - Register</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0d47a1,#42a5f5,#e3f2fd);padding:25px}
.card{width:460px;background:white;border-radius:25px;padding:32px;box-shadow:0 15px 40px rgba(0,0,0,.25)}
.logo{text-align:center;margin-bottom:22px}
.icon{width:65px;height:65px;margin:auto;border-radius:50%;background:linear-gradient(135deg,#0d47a1,#42a5f5);display:flex;justify-content:center;align-items:center;font-size:30px}
h1{margin-top:10px;color:#0d47a1}
.sub{text-align:center;color:#777;margin-top:5px}
h2{color:#17324d;margin:22px 0 15px}
label{display:block;margin:12px 0 6px;font-weight:bold;color:#263238}
input,select{width:100%;padding:13px;border:1px solid #c7d7e8;border-radius:11px;background:#f8fbff;outline:none}
input:focus,select:focus{border-color:#1976d2;box-shadow:0 0 0 3px rgba(25,118,210,.12)}
.btn{width:100%;padding:14px;margin-top:22px;border:0;border-radius:12px;background:linear-gradient(90deg,#0d47a1,#1976d2,#42a5f5);color:white;font-size:16px;font-weight:bold;cursor:pointer}
#message{text-align:center;margin-top:14px;font-weight:bold}
.bottom{text-align:center;margin-top:18px;color:#666}
.bottom a{color:#1565c0;font-weight:bold;text-decoration:none}
</style>
</head>

<body>

<div class="card">

<div class="logo">
<div class="icon">🍦</div>
<h1>Deva M Mart</h1>
<p class="sub">Create your account</p>
</div>

<h2>Registration</h2>

<label>Account Type</label>
<select id="accountType" onchange="showFields()">
<option value="buyer">👤 Buyer</option>
<option value="seller">🏪 Seller</option>
<option value="admin">🛠️ Admin</option>
</select>

<div id="fields"></div>

<button class="btn" onclick="register()">Create Account</button>

<p id="message"></p>

<p class="bottom">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>

function showFields(){

let type=document.getElementById("accountType").value;
let fields=document.getElementById("fields");

if(type==="buyer"){
fields.innerHTML=`
<label>Name</label>
<input type="text" id="name" placeholder="Enter your name">

<label>Email</label>
<input type="email" id="email" placeholder="Enter your email">

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter phone number">

<label>Password</label>
<input type="password" id="password" placeholder="Create password">

<label>Confirm Password</label>
<input type="password" id="confirm" placeholder="Confirm password">
`;
}

if(type==="seller"){
fields.innerHTML=`
<label>Seller Name</label>
<input type="text" id="name" placeholder="Enter seller name">

<label>Email</label>
<input type="email" id="email" placeholder="Enter seller email">

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter phone number">

<label>Shop Name</label>
<input type="text" id="shop" placeholder="Enter shop name">

<label>Password</label>
<input type="password" id="password" placeholder="Create password">

<label>Confirm Password</label>
<input type="password" id="confirm" placeholder="Confirm password">
`;
}

if(type==="admin"){
fields.innerHTML=`
<label>Admin Name</label>
<input type="text" id="name" placeholder="Enter admin name">

<label>Email</label>
<input type="email" id="email" placeholder="Enter admin email">

<label>Admin ID</label>
<input type="text" id="adminId" placeholder="Enter admin ID">

<label>Password</label>
<input type="password" id="password" placeholder="Create password">

<label>Confirm Password</label>
<input type="password" id="confirm" placeholder="Confirm password">
`;
}

}

function register(){

let type=document.getElementById("accountType").value;
let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;
let message=document.getElementById("message");

if(name===""||email===""||password===""||confirm===""){
message.style.color="red";
message.innerHTML="Please fill all required details!";
return;
}

if(password!==confirm){
message.style.color="red";
message.innerHTML="Passwords do not match!";
return;
}

let account={
type:type,
name:name,
email:email,
password:password
};

if(type==="buyer"){

let phone=document.getElementById("phone").value.trim();

if(phone===""){
message.style.color="red";
message.innerHTML="Please enter phone number!";
return;
}

account.phone=phone;
}

if(type==="seller"){

let phone=document.getElementById("phone").value.trim();
let shop=document.getElementById("shop").value.trim();

if(phone===""||shop===""){
message.style.color="red";
message.innerHTML="Please fill seller details!";
return;
}

account.phone=phone;
account.shop=shop;
}

if(type==="admin"){

let adminId=document.getElementById("adminId").value.trim();

if(adminId===""){
message.style.color="red";
message.innerHTML="Please enter Admin ID!";
return;
}

account.adminId=adminId;
}

localStorage.setItem(type+"Account",JSON.stringify(account));

message.style.color="green";
message.innerHTML="Account created successfully! ✓";

setTimeout(function(){
window.location.href="login.html";
},1000);

}

showFields();

</script>

</body>
</html>
